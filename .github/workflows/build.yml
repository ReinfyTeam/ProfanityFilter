name: Build and validate plugin
on:
 push:
   branches: [stable]
 pull_request:
   branches: [stable]
permissions:
 contents: read
jobs:
 build-phar:
   name: Build and test plugin
   runs-on: ubuntu-latest
   steps:
     - name: Check out repository
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
     - name: Download PHP binaries
       run: "curl -sL https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.4-latest/PHP-8.4-Linux-x86_64-PM5.tar.gz -o php.tar.gz"
     - name: Extract PHP binaries
       run: "tar -xvzf php.tar.gz"
     - name: Configure PHP binary permissions
       run: "chmod +x ./bin/php7/bin/php"
     - name: Configure PHP extension directory
       run: |
         EXTENSION_DIR=$(find "$(pwd)/bin" -type d -name "*debug-zts*")
         test -n "$EXTENSION_DIR"
         if grep -q '^extension_dir' bin/php7/bin/php.ini; then
           sed -i "s{^extension_dir=.*{extension_dir=\"$EXTENSION_DIR\"{" bin/php7/bin/php.ini
         else
           echo "extension_dir=\"$EXTENSION_DIR\"" >> bin/php7/bin/php.ini
         fi
     - name: Install Composer
       run: "curl -sL https://getcomposer.org/download/latest-stable/composer.phar -o composer.phar"
     - name: Install Composer dependencies
       run: "./bin/php7/bin/php -dphar.readonly=0 composer.phar install"
     - name: Apply locked PHP CS Fixer
       run: "./bin/php7/bin/php vendor/bin/php-cs-fixer fix src"
     - name: Run regression tests
       run: "./bin/php7/bin/php composer.phar test"
     - name: Build ProfanityFilter PHAR with Pharynx
       run: "./bin/php7/bin/php -dphar.readonly=0 composer.phar run-script --no-dev build"
     - name: Test packaged UI forms
       run: "./bin/php7/bin/php tests/ui-word-display.php phar://ProfanityFilter.phar/src"
     - name: Upload verified build artifact
       uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
       with:
          name: ProfanityFilter Build Phar
          path: ProfanityFilter.phar
          if-no-files-found: error
     - name: Upload build information artifact
       uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
       with:
          name: Build information
          path: build_info.json
          if-no-files-found: error
     - name: Clean up workspace
       run: "rm -rf *"
 build-poggit:
     name: Build Poggit package
     runs-on: ubuntu-latest
     permissions:
       contents: write
     steps:
       - name: Check out repository
         uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
       - name: Download PHP binaries
         run: "curl -sL https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.4-latest/PHP-8.4-Linux-x86_64-PM5.tar.gz -o php.tar.gz"
       - name: Extract PHP binaries
         run: "tar -xvzf php.tar.gz"
       - name: Configure PHP binary permissions
         run: "chmod +x ./bin/php7/bin/php"
       - name: Configure PHP extension directory
         run: |
           EXTENSION_DIR=$(find "$(pwd)/bin" -type d -name "*debug-zts*")
           test -n "$EXTENSION_DIR"
           if grep -q '^extension_dir' bin/php7/bin/php.ini; then
             sed -i "s{^extension_dir=.*{extension_dir=\"$EXTENSION_DIR\"{" bin/php7/bin/php.ini
           else
             echo "extension_dir=\"$EXTENSION_DIR\"" >> bin/php7/bin/php.ini
           fi
       - name: Install Composer
         run: "curl -sL https://getcomposer.org/download/latest-stable/composer.phar -o composer.phar"
       - name: Install Composer dependencies
         run: "./bin/php7/bin/php -dphar.readonly=0 composer.phar install"
       - name: Apply locked PHP CS Fixer
         run: "./bin/php7/bin/php vendor/bin/php-cs-fixer fix src"
       - name: Build Poggit package with Pharynx
         run: "./bin/php7/bin/php -dphar.readonly=0 composer.phar run-script --no-dev build-source"
       - name: Move Poggit metadata to output folder
         run: "mv .poggit.yml ./output/"
       - name: Publish Poggit build branch
         if: github.event_name == 'push' && github.ref == 'refs/heads/stable' && github.actor != 'dependabot[bot]'
         uses: s0/git-publish-subdir-action@ac113f6bfe8896e85a373534242c949a7ea74c98
         env:
          REPO: self
          BRANCH: build
          FOLDER: "./output/"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          MESSAGE: "ProfanityFilter Poggit Build: ({sha}) {msg}" 
       - name: Clean up workspace
         run: "rm -rf *"
